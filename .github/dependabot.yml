# Every action in the workflows is pinned to a commit SHA. Dependabot is what
# keeps those pins from going stale: it proposes the new SHA with the release
# notes, and a human reads the diff before merging, because the deploy workflow
# runs with the wordpress.org credentials.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      wordpress:
        patterns:
          - '@wordpress/*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
